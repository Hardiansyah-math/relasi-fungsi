</style></head><body>
<header class="top"><p class="sch">🏫 SMP Negeri 1 Terusan Nunyai</p><h1>🧩 Relasi dan Fungsi</h1><nav id="nv"></nav><div class="ctl"><button onclick="spk()">🔊 Dengarkan halaman</button><button onclick="stp()">⏹ Stop</button><button id="bm" onclick="music()">🎵 Musik latar</button><button id="bf" class="on" onclick="sfxT()">🔔 Efek suara</button><span id="as" role="status"></span></div></header>

<script>
const $=s=>document.querySelector(s),shuf=a=>[...a].sort(()=>Math.random()-.5);
const TABS=[['home','🏠 Beranda'],['materi','📖 Materi'],['anim','🎬 Animasi'],['latihan','✏️ Latihan'],['kuis','🧠 Kuis'],['game','🎮 Gameshow']];
$('#nv').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
function go(id){document.querySelectorAll('.pg').forEach(p=>p.hidden=p.id!==id);document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));if(id==='home')home();if(id==='kuis'&&!QZ.on)kstart();if(id==='game'&&!G.on)gmenu();scrollTo(0,0)}
let aid=0;
function arrows(A,B,P){aid++;const h=Math.max(A.length,B.length)*30+20,y=(i,l)=>h/2+(i-(l-1)/2)*30;
let s=`<svg class="ar" viewBox="0 0 280 ${h}" role="img" aria-label="Diagram panah"><defs><marker id="m${aid}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs><rect class="bx" x="14" y="4" width="64" height="${h-8}" rx="22"/><rect class="bx" x="202" y="4" width="64" height="${h-8}" rx="22"/>`;
P.forEach(([a,b])=>s+=`<line x1="52" y1="${y(A.indexOf(a),A.length)}" x2="226" y2="${y(B.indexOf(b),B.length)}" marker-end="url(#m${aid})"/>`);
A.forEach((a,i)=>s+=`<text x="34" y="${y(i,A.length)+5}" text-anchor="middle">${a}</text>`);
B.forEach((b,i)=>s+=`<text x="244" y="${y(i,B.length)+5}" text-anchor="middle">${b}</text>`);
return s+'</svg>'}
const SEEN=new Set();
/* ===== BERANDA ===== */
const GOALS=['Memahami konsep himpunan, relasi, dan fungsi.','Menjelaskan contoh kegiatan sehari-hari yang berkaitan dengan himpunan, relasi, dan fungsi.','Menyajikan relasi dengan diagram panah, diagram Cartesius, dan himpunan pasangan berurutan.','Menjelaskan ciri-ciri dan cara menyajikan fungsi.','Menghitung nilai fungsi dan menggambar grafik fungsi pada koordinat Cartesius.','Menyajikan hasil penyelesaian masalah yang terkait relasi dan fungsi.'];
function home(){$('#home').innerHTML=`<div class="card hero"><h2>Kapan suatu relasi dapat menyatakan fungsi?</h2><p>Belajar Bab 4 Matematika Kelas VIII lewat materi bergambar, latihan, kuis, dan gameshow. Mulai dari bagian Materi, ya!</p><button onclick="go('materi')">Mulai belajar</button></div>
<div class="card"><h2>🎯 Tujuan pembelajaran</h2><p>Setelah menyelesaikan bab ini, kamu mampu:</p>${GOALS.map((g,i)=>`<label style="display:block;margin:6px 0"><input type="checkbox"> ${g}</label>`).join('')}</div>
<div class="card"><h2>🤔 Pertanyaan pemantik</h2><p>Siswa duduk di kursi tertentu, tetapi satu kursi panjang bisa memuat banyak siswa. Apakah hubungan siswa dan kursi itu relasi atau fungsi? Simpan jawabanmu, lalu cek lagi setelah belajar.</p><p><span class="chip">himpunan</span><span class="chip">relasi</span><span class="chip">fungsi</span><span class="chip">domain</span><span class="chip">kodomain</span><span class="chip">range</span><span class="chip">korespondensi satu-satu</span></p></div>
<div class="card"><h2>📈 Progres materi</h2><div class="bar"><i style="width:${SEEN.size*20}%"></i></div><p>${SEEN.size} dari 5 bagian sudah dibuka.</p></div>
<div class="grid"><button onclick="go('anim')">🎬 Animasi materi</button><button onclick="go('latihan')">✏️ Latihan isian</button><button onclick="go('kuis')">🧠 Kuis pilihan ganda</button><button class="pri" onclick="go('game')">🎮 Main gameshow</button></div>`}
/* ===== MATERI ===== */
const M=[
{t:'1. Himpunan',b:()=>`<div class="def"><b>Himpunan</b> adalah kumpulan objek tertentu yang dapat diidentifikasi dengan jelas. Banyak anggotanya disebut <b>kardinalitas</b>, ditulis n(A).</div>
<p>Contoh: anak-anak Bani Madhuri membentuk himpunan A = {Sulastri, M. Idris, A. Halim, M. Tohir}, sehingga n(A) = 4.</p>
<h3>Tiga cara menyajikan himpunan</h3>
<div class="sc"><table><tr><th>Cara</th><th>Artinya</th><th>Contoh</th></tr><tr><td>Deskripsi</td><td>dengan kata-kata</td><td>A = {bilangan asli kurang dari 5}</td></tr><tr><td>Enumerasi</td><td>menyebut anggotanya</td><td>A = {1, 2, 3, 4}</td></tr><tr><td>Notasi pembentuk</td><td>syarat untuk x</td><td>A = {x | x &lt; 5, x bilangan asli}</td></tr></table></div>
<div class="ex"><b>Berhingga atau tak berhingga?</b><br>G = {2, 4, 6, …, 20} berhingga (10 anggota). H = {…, −2, −1, 0, 1, 2, …} tak berhingga, jadi lebih tepat ditulis dengan notasi pembentuk himpunan.</div>`},
{t:'2. Relasi',b:()=>`<p>Andino, Natalia, Taufiq, Panggabean, dan Nyoman memesan makanan di restoran ABC. Tiap anak punya pasangan makanan pesanannya. Itulah <b>relasi</b>.</p>
<div class="def"><b>Relasi</b> dari himpunan A ke himpunan B adalah hubungan yang memasangkan anggota A dengan anggota B.<br>• <b>Domain</b> (daerah asal) = himpunan A<br>• <b>Kodomain</b> (daerah kawan) = himpunan B<br>• <b>Range</b> (daerah hasil) = anggota B yang mendapat pasangan</div>
<h3>Contoh: A = {2, 3, 5}, B = {1, 4, 5, 6}, relasi “kurang dari”</h3>
${arrows([2,3,5],[1,4,5,6],[[2,4],[2,5],[2,6],[3,4],[3,5],[3,6],[5,6]])}
<p>Domain = {2, 3, 5}, Kodomain = {1, 4, 5, 6}, <b>Range = {4, 5, 6}</b> (angka 1 tidak punya pasangan).</p>
<h3>Tiga cara menyajikan relasi</h3>
<div class="grid"><div class="tip"><b>Diagram panah</b><br>anak panah dari A ke B</div><div class="tip"><b>Diagram Cartesius</b><br>anggota A di sumbu x, anggota B di sumbu y, pasangan jadi titik</div><div class="tip"><b>Pasangan berurutan</b><br>{(2, 4), (2, 5), (2, 6), (3, 4), (3, 5), (3, 6), (5, 6)}</div></div>`},
{t:'3. Fungsi',b:()=>`<div class="def"><b>Fungsi</b> adalah relasi khusus yang menghubungkan setiap anggota domain dengan <b>tepat satu</b> anggota kodomain.</div>
<p>Dua pertanyaan pengecek: (1) apakah <b>semua</b> anggota domain punya pasangan? (2) apakah tiap anggota domain punya <b>hanya satu</b> pasangan? Jika keduanya “ya”, relasi itu fungsi.</p>
<div class="card"><h3>🔬 Coba sendiri</h3><p>Ketuk tombol untuk membuat pasangan dari P = {1, 2, 3} ke Q = {a, b, c}.</p><div id="mp"></div></div>
<div class="ex"><b>Contoh kasus.</b> Telur ke krat telur adalah fungsi, karena tiap telur berada di satu lubang. Krat ke telur bukan fungsi, karena satu wadah bisa memuat banyak telur.</div>
<h3>Banyak fungsi yang mungkin</h3>
<p>Jika domain punya m anggota dan kodomain punya n anggota, banyak fungsinya adalah <b>nᵐ</b>.</p>
<div class="sc"><table><tr><th>Fungsi</th><th>m</th><th>n</th><th>Banyak fungsi</th></tr><tr><td>A → B</td><td>1</td><td>2</td><td>2¹ = 2</td></tr><tr><td>B → C</td><td>2</td><td>3</td><td>3² = 9</td></tr><tr><td>C → A</td><td>3</td><td>1</td><td>1³ = 1</td></tr><tr><td>C → B</td><td>3</td><td>2</td><td>2³ = 8</td></tr></table></div>`},
{t:'4. Menyajikan dan menghitung fungsi',b:()=>`<p>Fungsi f(x) = 2x dari P = {1, 2, 3, 4, 5} dapat disajikan dengan <b>lima cara</b>:</p>
<div class="grid"><div class="tip"><b>1. Diagram panah</b>${arrows([1,2,3],[2,4,6],[[1,2],[2,4],[3,6]])}</div><div class="tip"><b>2. Pasangan berurutan</b><br>{(1, 2), (2, 4), (3, 6), (4, 8), (5, 10)}<br><b>3. Persamaan</b><br>f(x) = 2x</div></div>
<div class="sc"><table><tr><th>4. Tabel x</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><th>f(x)</th><td>2</td><td>4</td><td>6</td><td>8</td><td>10</td></tr></table></div>
<p><b>5. Grafik:</b> titik-titik (1, 2), (2, 4), (3, 6), … terletak pada satu garis lurus di koordinat Cartesius.</p>
<h3>Nilai fungsi</h3>
<div class="def">Untuk menghitung nilai fungsi, <b>substitusikan</b> nilai x ke rumus fungsinya.</div>
<div class="ex">f(x) = 4x − 3<br>f(−2) = 4(−2) − 3 = −11<br>f(3) = 4(3) − 3 = 9</div>
<h3>Menemukan rumus fungsi linear f(x) = ax + b</h3>
<div class="ex">Diketahui f(−1) = −4 dan f(2) = 5.<br>−a + b = −4 … (1)<br>2a + b = 5 … (2)<br>Kurangkan (2) − (1): 3a = 9, sehingga a = 3. Dari (2): 6 + b = 5, sehingga b = −1.<br><b>f(x) = 3x − 1</b></div>
<div class="card"><h3>🚕 Tarif taksi: B(x) = 7.500 + 3.000x</h3><p>Geser jarak tempuh: <input type="range" id="tx" min="0" max="60" value="20" oninput="tax()"> <b id="tl"></b></p><p class="big" id="tv"></p></div>`},
{t:'5. Korespondensi satu-satu',b:()=>`<div class="def"><b>Korespondensi satu-satu</b> adalah fungsi khusus: setiap anggota domain berpasangan dengan tepat satu anggota kodomain, dan sebaliknya. Contoh: setiap siswa punya satu nomor induk yang tidak dimiliki siswa lain.</div>
${arrows(['Ahmad','Tohir','Wati'].map((s,i)=>i+1),['a','b','c'],[[1,'b'],[2,'a'],[3,'c']])}
<p>Syarat perlu: banyak anggota kedua himpunan <b>sama</b>, n(A) = n(B). Jika n(A) ≠ n(B), pasti bukan korespondensi satu-satu.</p>
<h3>Banyak korespondensi satu-satu</h3>
<p>Jika n(A) = n(B) = n, banyaknya adalah <b>n! = n × (n − 1) × … × 2 × 1</b>.</p>
<div class="sc"><table><tr><th>n</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr><tr><th>n!</th><td>1</td><td>2</td><td>6</td><td>24</td><td>120</td><td>720</td></tr></table></div>
<h3>Hubungan ketiganya</h3>
<div class="nest">Relasi<div class="nest">Fungsi<div class="nest">Korespondensi satu-satu</div></div></div>
<p>Setiap korespondensi satu-satu pasti fungsi, dan setiap fungsi pasti relasi. Kebalikannya belum tentu benar.</p>`}];
let mi=0;
function materi(){SEEN.add(mi);const m=M[mi];$('#materi').innerHTML=`<div class="bar"><i style="width:${(mi+1)*20}%"></i></div><div style="margin:10px 0">${M.map((x,i)=>`<button class="${i===mi?'on':''}" onclick="mi=${i};materi()" style="margin:3px">${i+1}</button>`).join('')}</div><div class="card"><h2>${m.t}</h2>${m.b()}</div><div style="display:flex;justify-content:space-between"><button ${mi?'':'disabled'} onclick="mi--;materi()">← Sebelumnya</button>${mi<4?'<button class="pri" onclick="mi++;materi()">Berikutnya →</button>':'<button class="pri" onclick="go(\'latihan\')">Ke latihan ✏️</button>'}</div>`;
if(mi===2)mapper();if(mi===3)tax();scrollTo(0,0)}
TABS[1][2]=0;
const _go=go;go=function(id){stp();fx('clk');_go(id);if(id==='materi')materi();if(id==='latihan')latih();if(id==='anim')aui()};
/* widget pemetaan */
const SEL={1:[],2:[],3:[]};
function tg(p,q){const a=SEL[p],i=a.indexOf(q);i<0?a.push(q):a.splice(i,1);mapper()}
function mapper(){const Q=['a','b','c'],P=[];for(const p in SEL)SEL[p].forEach(q=>P.push([+p,q]));
let v,c='bad';const no=[1,2,3].filter(p=>!SEL[p].length),mu=[1,2,3].filter(p=>SEL[p].length>1);
if(no.length)v=`Bukan fungsi: anggota ${no.join(', ')} belum punya pasangan.`;else if(mu.length)v=`Bukan fungsi: anggota ${mu.join(', ')} punya lebih dari satu pasangan.`;else{v='Fungsi! Setiap anggota P punya tepat satu pasangan. (Ada 3³ = 27 fungsi yang mungkin.)';c='ok'}
$('#mp').innerHTML=[1,2,3].map(p=>`<div>${p} → ${Q.map(q=>`<button class="${SEL[p].includes(q)?'on':''}" onclick="tg(${p},'${q}')" style="padding:3px 12px;margin:2px">${q}</button>`).join('')}</div>`).join('')+arrows([1,2,3],Q,P)+`<p class="fb" style="color:var(--${c})">${v}</p>`}
function tax(){const x=+$('#tx').value;$('#tl').textContent=x+' km';$('#tv').textContent='Rp'+(7500+3000*x).toLocaleString('id-ID')}
/* ===== BANK SOAL ===== */
const Q=[
['Jika n(A) = 3 dan n(B) = 2, banyak fungsi dari A ke B adalah …',['5','6','8','9'],2,'Banyak fungsi = n(B)^n(A) = 2³ = 8.'],
['Relasi “satu lebihnya dari” dari P = {3, 4, 5} ke Q = {1, 2, 3, 4}. Range-nya adalah …',['{3, 4, 5}','{2, 3, 4}','{1, 2, 3, 4}','{3, 4}'],1,'Pasangannya (3, 2), (4, 3), (5, 4). Anggota Q yang mendapat pasangan: 2, 3, 4.'],
['Syarat relasi disebut fungsi adalah …',['setiap anggota kodomain punya pasangan','setiap anggota domain punya tepat satu pasangan','banyak anggota domain dan kodomain sama','ada anggota domain yang berpasangan dua kali'],1,'Fungsi: setiap anggota domain berpasangan dengan tepat satu anggota kodomain.'],
['Domain = {1, 2, 3}. Manakah yang merupakan fungsi ke {a, b}?',['{(1, a), (1, b), (2, b)}','{(1, a), (2, a), (3, b)}','{(1, a), (2, b)}','{(1, a), (2, a), (2, b), (3, b)}'],1,'Hanya pilihan ini yang membuat 1, 2, 3 masing-masing punya tepat satu pasangan.'],
['Jika f(x) = 4x − 3, maka f(−2) = …',['−11','−5','5','11'],0,'f(−2) = 4(−2) − 3 = −8 − 3 = −11.'],
['Fungsi linear f memenuhi f(−1) = −4 dan f(2) = 5. Rumus fungsinya adalah …',['f(x) = 2x − 2','f(x) = 3x − 1','f(x) = 3x + 1','f(x) = x − 3'],1,'Selisih nilai 9 untuk selisih x 3, jadi a = 3. Lalu 3(2) + b = 5 sehingga b = −1.'],
